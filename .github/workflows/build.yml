name: Build Mishti APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip newest project zip
        run: |
          ZIP=$(ls mishti_v*.zip | sort -V | tail -n 1)
          echo "Using $ZIP"
          unzip -q "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: mishti
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: " build.log | head -20 | while read -r l; do echo "::error::$l"; done
          grep -A6 "What went wrong" build.log | head -12 | while read -r l; do echo "::error::$l"; done
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: Mishti-debug-apk
          path: mishti/app/build/outputs/apk/debug/app-debug.apk
