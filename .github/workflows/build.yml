name: Build Mishti APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip newest project zip
        run: |
          ZIP=$(ls mishti_v*.zip | sort -V | tail -n 1)
          echo "Using $ZIP"
          unzip -q "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: mishti
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Mishti-debug-apk
          path: mishti/app/build/outputs/apk/debug/app-debug.apk
